<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 712" role="img" aria-label="One evaluation through the stack, as numbered steps across lanes for the browser, the Next.js server, FastAPI, LangGraph, Azure OpenAI, FRED and Tavily, PostgreSQL, and Langfuse with the metrics. The legend below explains each step.">
  <defs>
    <marker id="oe-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7c786d"/>
    </marker>
  </defs>

  <text class="t-label" x="200" y="26">ONE EVALUATION, LEFT TO RIGHT</text>
  <path class="wire soft" d="M470 21 H1386" marker-end="url(#oe-arrow)"/>

  <!-- Lanes -->
  <rect x="0" y="40" width="1400" height="52" style="fill:#efece5"/>
  <rect x="0" y="144" width="1400" height="52" style="fill:#efece5"/>
  <rect x="0" y="248" width="1400" height="52" style="fill:#efece5"/>
  <rect x="0" y="352" width="1400" height="52" style="fill:#efece5"/>

  <circle cx="22" cy="66" r="15" fill="#e4ebf5"/><icon name="window" x="13" y="57" s="18" c="#163c6b"/>
  <text class="t-strong" x="46" y="71">Browser</text>
  <circle cx="22" cy="118" r="15" fill="#e4ebf5"/><icon name="server" x="13" y="109" s="18" c="#163c6b"/>
  <text class="t-strong" x="46" y="123">Next.js server</text>
  <circle cx="22" cy="170" r="15" fill="#e4ebf5"/><icon name="flow" x="13" y="161" s="18" c="#163c6b"/>
  <text class="t-strong" x="46" y="175">FastAPI</text>
  <circle cx="22" cy="222" r="15" fill="#e6e3f4"/><icon name="team" x="13" y="213" s="18" c="#3b2e8a"/>
  <text class="t-strong" x="46" y="227">LangGraph</text>
  <circle cx="22" cy="274" r="15" fill="#dce9f8"/><icon name="spark" x="13" y="265" s="18" c="#1c5cab"/>
  <text class="t-strong" x="46" y="279">Azure OpenAI</text>
  <circle cx="22" cy="326" r="15" fill="#e5e8ec"/><icon name="search" x="13" y="317" s="18" c="#48525f"/>
  <text class="t-strong" x="46" y="331">FRED · Tavily</text>
  <circle cx="22" cy="378" r="15" fill="#dce9f8"/><icon name="state" x="13" y="369" s="18" c="#1c5cab"/>
  <text class="t-strong" x="46" y="383">PostgreSQL</text>
  <circle cx="22" cy="430" r="15" fill="#fbe5ee"/><icon name="pulse" x="13" y="421" s="18" c="#b03c6f"/>
  <text class="t-strong" x="46" y="435">Langfuse · metrics</text>

