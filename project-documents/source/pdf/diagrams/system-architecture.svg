<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-label="System architecture: the founder's browser, the Next.js web app and its server-side proxy, the FastAPI service with its guard, routes and modules, and the external services it uses">
  <defs>
    <marker id="sa-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7c786d"/>
    </marker>
  </defs>

  <!-- Founder -->
  <g class="n">
    <rect class="box" x="4" y="294" width="150" height="132" rx="12"/>
    <circle cx="79" cy="336" r="24" fill="#e4ebf5"/>
    <icon name="user" x="67" y="324" s="24" c="#163c6b"/>
    <text class="t-title" x="79" y="386" text-anchor="middle">Founder</text>
    <text class="t-small" x="79" y="408" text-anchor="middle">in a browser</text>
  </g>
  <path class="wire" d="M154 360 H180" marker-end="url(#sa-arrow)"/>

  <!-- Next.js web app -->
  <rect class="zone" x="186" y="112" width="290" height="496" rx="16"/>
  <text class="t-label" x="204" y="140">NEXT.JS 16 WEB APP</text>

  <g class="n">
    <rect class="box" x="202" y="158" width="258" height="184" rx="10"/>
    <icon name="window" x="220" y="176" s="20" c="#163c6b"/>
    <text class="t-title" x="250" y="192">Pages</text>
    <text class="t-body" x="220" y="228"><tspan class="t-strong">Evaluate</tspan> · live graph</text>
    <text class="t-body" x="220" y="256"><tspan class="t-strong">Reports</tspan> · document studio</text>
    <text class="t-body" x="220" y="284"><tspan class="t-strong">How it works</tspan> · Monitor</text>
    <text class="t-small" x="220" y="320">React 19 · Tailwind CSS 4</text>
  </g>
  <path class="wire" d="M331 342 V370" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="202" y="378" width="258" height="214" rx="10"/>
    <icon name="server" x="220" y="396" s="20" c="#163c6b"/>
    <text class="t-title" x="250" y="412">Server-side proxy</text>
    <text class="t-body" x="220" y="448">Adds the API key on the</text>
    <text class="t-body" x="220" y="470">server: never in the browser</text>
    <text class="t-body" x="220" y="504">Caps bodies; streams the</text>
    <text class="t-body" x="220" y="526">team's progress (SSE)</text>
    <text class="t-small" x="220" y="566">app/api/[...path]/route.ts</text>
  </g>
  <path class="wire" d="M460 486 H494" marker-end="url(#sa-arrow)"/>

  <!-- FastAPI service -->
  <rect class="zone" x="500" y="4" width="586" height="712" rx="16"/>
  <text class="t-label" x="518" y="32">FASTAPI SERVICE · PYTHON 3.12</text>

  <g class="n">
    <rect class="box" x="516" y="46" width="554" height="52" rx="10" fill="#e4ebf5" stroke="#163c6b"/>
    <icon name="shield" x="534" y="62" s="20" c="#163c6b"/>
    <text class="t-title" x="564" y="78">Guard</text>
    <text class="t-body" x="634" y="78">API key · body size · rates · runs at once</text>
  </g>
  <path class="wire" d="M793 98 V106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="516" y="110" width="554" height="52" rx="10"/>
    <icon name="flow" x="534" y="126" s="20" c="#4b4840"/>
    <text class="t-title" x="564" y="142">29 routes</text>
    <text class="t-body" x="666" y="142">brief · evaluate · reports · uploads · ask</text>
  </g>

  <g class="n">
    <rect class="box" x="516" y="176" width="554" height="174" rx="10" fill="#f3f1fa" stroke="#4a3aa7"/>
    <icon name="state" x="534" y="194" s="20" c="#4a3aa7"/>
    <text class="t-title" x="564" y="210">The founding team</text>
    <text class="t-small" x="738" y="210">LangGraph state machine</text>
    <circle cx="556" cy="256" r="21" fill="#e6e3f4" stroke="#4a3aa7" stroke-width="1.6"/>
    <icon name="chief" x="545" y="245" s="22" c="#4a3aa7"/>
    <text class="t-strong" x="590" y="252">Chief of Staff</text>
    <text class="t-small" x="590" y="271">plans, reviews, settles, decides</text>
    <circle cx="556" cy="312" r="17" fill="#fbe3d8" stroke="#eb6834" stroke-width="1.6"/>
    <icon name="megaphone" x="547" y="303" s="18" c="#eb6834"/>
    <circle cx="598" cy="312" r="17" fill="#d9f1e7" stroke="#1baf7a" stroke-width="1.6"/>
    <icon name="chart" x="589" y="303" s="18" c="#1baf7a"/>
    <circle cx="640" cy="312" r="17" fill="#dce9f8" stroke="#2a78d6" stroke-width="1.6"/>
    <icon name="chip" x="631" y="303" s="18" c="#2a78d6"/>
    <circle cx="682" cy="312" r="17" fill="#fbe5ee" stroke="#e87ba4" stroke-width="1.6"/>
    <icon name="shield" x="673" y="303" s="18" c="#e87ba4"/>
    <text class="t-strong" x="712" y="308">Four specialists</text>
    <text class="t-small" x="712" y="327">market, finance, build, risk</text>
    <text class="t-small" x="1054" y="252" text-anchor="end">Pydantic-typed decisions</text>
    <text class="t-small" x="1054" y="271" text-anchor="end">bounded review loops</text>
    <text class="t-small" x="1054" y="308" text-anchor="end">work in parallel</text>
    <text class="t-small" x="1054" y="327" text-anchor="end">checkpointed per session</text>
  </g>

  <g class="n">
    <rect class="box" x="516" y="364" width="270" height="76" rx="10"/>
    <icon name="search" x="534" y="380" s="20" c="#48525f"/>
    <text class="t-title" x="564" y="396">Brief preparation</text>
    <text class="t-body" x="534" y="424">Cited facts, then questions</text>
  </g>
  <g class="n">
    <rect class="box" x="800" y="364" width="270" height="76" rx="10"/>
    <icon name="paperclip" x="818" y="380" s="20" c="#48525f"/>
    <text class="t-title" x="848" y="396">Founder's documents</text>
    <text class="t-body" x="818" y="424">Uploads read into passages</text>
  </g>
  <g class="n">
    <rect class="box" x="516" y="454" width="270" height="76" rx="10"/>
    <icon name="document" x="534" y="470" s="20" c="#48525f"/>
    <text class="t-title" x="564" y="486">Reports and studio</text>
    <text class="t-body" x="534" y="514">Drafts, versions, the PDF</text>
  </g>
  <g class="n">
    <rect class="box" x="800" y="454" width="270" height="76" rx="10"/>
    <icon name="chart" x="818" y="470" s="20" c="#48525f"/>
    <text class="t-title" x="848" y="486">Investment proposal</text>
    <text class="t-body" x="818" y="514">Five parts; figures in code</text>
  </g>

  <g class="n">
    <rect class="box" x="516" y="544" width="176" height="76" rx="10" fill="#faefd6" stroke="#855600"/>
    <icon name="shield" x="532" y="560" s="20" c="#855600"/>
    <text class="t-title" x="560" y="576">Guardrails</text>
    <text class="t-body" x="532" y="604">Untrusted text fenced</text>
  </g>
  <g class="n">
    <rect class="box" x="705" y="544" width="176" height="76" rx="10"/>
    <icon name="pulse" x="721" y="560" s="20" c="#48525f"/>
    <text class="t-title" x="749" y="576">Monitor</text>
    <text class="t-body" x="721" y="604">Logs and metrics</text>
  </g>
  <g class="n">
    <rect class="box" x="894" y="544" width="176" height="76" rx="10"/>
    <icon name="flow" x="910" y="560" s="20" c="#48525f"/>
    <text class="t-title" x="938" y="576">Tracing</text>
    <text class="t-body" x="910" y="604">Every call, masked</text>
  </g>
  <g class="n">
    <rect class="box" x="516" y="634" width="554" height="64" rx="10" fill="#efece5" stroke="#efece5"/>
    <text class="t-small" x="534" y="662">Modules: main.py, graph.py, agents/, brief.py, deep_research.py, lookups.py,</text>
    <text class="t-small" x="534" y="684">library.py, reports.py, document.py, guardrails.py, monitor.py, tracing.py</text>
  </g>

  <!-- External services -->
  <text class="t-label" x="1112" y="32">SERVICES IT USES</text>

  <path class="wire" d="M1086 92 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="46" width="284" height="88" rx="10"/>
    <icon name="spark" x="1128" y="62" s="20" c="#163c6b"/>
    <text class="t-title" x="1156" y="78">Azure OpenAI</text>
    <text class="t-body" x="1128" y="104">gpt-5-mini, structured outputs</text>
    <text class="t-small" x="1128" y="124">and Bing web search</text>
  </g>
  <path class="wire" d="M1086 189 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="144" width="284" height="88" rx="10"/>
    <icon name="globe" x="1128" y="160" s="20" c="#48525f"/>
    <text class="t-title" x="1156" y="176">Tavily</text>
    <text class="t-body" x="1128" y="202">Search, research, MCP</text>
    <text class="t-small" x="1128" y="222">for demanding research</text>
  </g>
  <path class="wire" d="M1086 287 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="242" width="284" height="88" rx="10"/>
    <icon name="server" x="1128" y="258" s="20" c="#48525f"/>
    <text class="t-title" x="1156" y="274">FRED, through MCP</text>
    <text class="t-body" x="1128" y="300">The app's own MCP server</text>
    <text class="t-small" x="1128" y="320">official US economic data</text>
  </g>
  <path class="wire" d="M1086 385 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="340" width="284" height="88" rx="10"/>
    <icon name="swap" x="1128" y="356" s="20" c="#48525f"/>
    <text class="t-title" x="1156" y="372">European Central Bank</text>
    <text class="t-body" x="1128" y="398">Today's exchange rates</text>
    <text class="t-small" x="1128" y="418">for currency conversions</text>
  </g>
  <path class="wire" d="M1086 483 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="438" width="284" height="88" rx="10"/>
    <icon name="server" x="1128" y="454" s="20" c="#163c6b"/>
    <text class="t-title" x="1156" y="470">PostgreSQL</text>
    <text class="t-body" x="1128" y="496">Sessions, reports, versions</text>
    <text class="t-small" x="1128" y="516">uploads, the Monitor's history</text>
  </g>
  <path class="wire" d="M1086 581 H1106" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="536" width="284" height="88" rx="10"/>
    <icon name="flow" x="1128" y="552" s="20" c="#48525f"/>
    <text class="t-title" x="1156" y="568">Langfuse Cloud</text>
    <text class="t-body" x="1128" y="594">Traces, prompts, scores</text>
    <text class="t-small" x="1128" y="614">optional</text>
  </g>
  <path class="wire" d="M1106 679 H1092" marker-end="url(#sa-arrow)"/>
  <g class="n">
    <rect class="box" x="1112" y="634" width="284" height="82" rx="10"/>
    <icon name="pulse" x="1128" y="650" s="20" c="#48525f"/>
    <text class="t-title" x="1156" y="666">Prometheus</text>
    <text class="t-body" x="1128" y="692">Scrapes /metrics (optional)</text>
  </g>
</svg>
