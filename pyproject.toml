[project]
name = "ai-startup-cofounder"
version = "0.1.0"
description = "The AI Startup Co-Founder Team - autonomous multi-agent venture simulator built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "httpx>=0.28",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langfuse>=5.0.4,<6",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-postgres>=3.2.0",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.21",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "striprtf>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "frontend/*"]

[tool.coverage.report]
show_missing = true
# `pytest --cov` fails if the tests cover less than this share of the code.
fail_under = 80
