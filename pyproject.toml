[project]
name = "ai-startup-cofounder"
version = "0.1.0"
description = "The AI Startup Co-Founder Team - autonomous multi-agent venture simulator built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.66.0",
]
