[project]
name = "ai-startup-cofounder"
version = "0.1.0"
description = "The AI Startup Co-Founder Team - autonomous multi-agent venture simulator built with LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "fpdf2>=2.8.9",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langgraph>=1.2.15",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
ui = [
    "httpx>=0.28.1",
    "pypdfium2>=5.14.0",
    "streamlit>=1.66.0",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "frontend/*"]

[tool.coverage.report]
show_missing = true
# `pytest --cov` fails if the tests cover less than this share of the code.
fail_under = 80
